AWSTemplateFormatVersion: "2010-09-09"
Description: Meetings App - ECR repository for the backend image (deployed before the backend stack).

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      RepositoryName: !Sub ${ProjectName}-backend
      ImageTagMutability: MUTABLE
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      # Lets Lambda functions of this account pull the image.
      RepositoryPolicyText:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              StringLike:
                aws:sourceArn: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*
      # Keep storage inside the 500 MB free tier: only the newest images are retained.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the last 5 images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
              "action": { "type": "expire" }
            }]
          }

Outputs:
  RepositoryUri:
    Description: Push backend images here.
    Value: !GetAtt BackendRepository.RepositoryUri
