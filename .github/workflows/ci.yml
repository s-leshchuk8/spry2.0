name: Manual application deployment
# Infrastructure/model calls and migrations remain separately approved operations.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment: aws-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Validate deployment configuration
        env:
          API: ${{ vars.VITE_API_URL }}
          PARSER: ${{ vars.VITE_AGENDA_PARSER_URL }}
          CLIENT: ${{ vars.COGNITO_CLIENT_ID }}
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: test -n "$API" && test -n "$PARSER" && test -n "$CLIENT" && test -n "$BUCKET"
      - name: Test and build
        working-directory: front
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AGENDA_PARSER_URL: ${{ vars.VITE_AGENDA_PARSER_URL }}
          VITE_COGNITO_REGION: ${{ vars.COGNITO_REGION || 'us-east-1' }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          VITE_COGNITO_GOOGLE: ${{ vars.COGNITO_GOOGLE_ENABLED }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Publish frontend
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: aws s3 sync front/dist "s3://$BUCKET"
  deploy-backend:
    runs-on: ubuntu-latest
    environment: aws-deployment
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        env:
          ECR_URI: ${{ vars.BACKEND_ECR_URI }}
          FUNCTION: ${{ vars.BACKEND_FUNCTION }}
        run: test -n "$ECR_URI" && test -n "$FUNCTION"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish API image
        env:
          ECR_URI: ${{ vars.BACKEND_ECR_URI }}
          FUNCTION: ${{ vars.BACKEND_FUNCTION }}
          PLATFORM: ${{ vars.BACKEND_PLATFORM || 'linux/arm64' }}
        run: |
          docker buildx build --platform "$PLATFORM" --provenance=false -f backend/Dockerfile.lambda -t "$ECR_URI:$GITHUB_SHA" --push backend
          aws lambda update-function-code --function-name "$FUNCTION" --image-uri "$ECR_URI:$GITHUB_SHA"
